asyncapi: "2.6.0"
info:
  title: Routify Event API
  version: "1.0.0"
  description: Event-driven API for Routify

servers:
  production:
    url: kafka://localhost:9092
    protocol: kafka

channels:
  user.created:
    description: Event when user is created
    publish:
      message:
        name: UserCreated
        payload:
          type: object
          properties:
            userId:
              type: string
            email:
              type: string
